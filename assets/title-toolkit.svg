  <style>.urt-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}.urt-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.urt-in{animation:urt-in 1.1s cubic-bezier(.16,1,.3,1) both}.urt-d2{animation-delay:.2s}.urt-d3{animation-delay:.45s}.urt-draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:urt-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards}@keyframes urt-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes urt-draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.urt-in{animation:none}.urt-draw{animation:none;stroke-dashoffset:0}}</style>
