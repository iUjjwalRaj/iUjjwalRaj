<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="urm-title urm-desc">
  <title id="urm-title">MAYA project card</title><desc id="urm-desc">MAYA is an offline-first conversational AI assistant architecture with a shared conversation and security state.</desc>
  <defs><linearGradient id="urm-border" x1="0" x2="1"><stop stop-color="#D6B779" stop-opacity=".6"/><stop offset="1" stop-color="#8B7CFF" stop-opacity=".45"/></linearGradient><radialGradient id="urm-glow"><stop stop-color="#8B7CFF" stop-opacity=".23"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient></defs>
  <style>.urm-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.urm-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}.urm-in{opacity:1;animation:urm-in 1s cubic-bezier(.16,1,.3,1) forwards}@keyframes urm-in{from{opacity:1;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.urm-in{opacity:1;animation:none}}</style>
  <rect width="1200" height="300" rx="18" fill="#090B10" stroke="url(#urm-border)"/><circle cx="1030" cy="150" r="240" fill="url(#urm-glow)"/>
  <g fill="none" stroke="#D6B779" stroke-opacity=".7"><path d="M760 150h82m76 0h110m-153-43v86m-36-43a79 79 0 1 0 158 0 79 79 0 1 0-158 0z"/><path d="M860 150l40-42 38 42-38 42z" stroke="#8B7CFF"/></g><g fill="#D6B779"><circle cx="900" cy="108" r="5"/><circle cx="900" cy="192" r="5"/><circle cx="842" cy="150" r="4"/><circle cx="1010" cy="150" r="4"/></g>
  <g class="urm-in"><text class="urm-mono" x="58" y="48" fill="#80CFFF" font-size="11" letter-spacing="3">01 / OFFLINE-FIRST AI ASSISTANT</text><text class="urm-serif" x="56" y="128" fill="#F2F1ED" font-size="58">MAYA</text><text class="urm-mono" x="58" y="171" fill="#D6B779" font-size="15">A conversational assistant architecture built around</text><text class="urm-mono" x="58" y="197" fill="#D6B779" font-size="15">shared conversation and security state.</text><text class="urm-mono" x="58" y="248" fill="#80CFFF" font-size="12" letter-spacing="2">STACK NOT PUBLISHED IN THE REPOSITORY</text></g>
