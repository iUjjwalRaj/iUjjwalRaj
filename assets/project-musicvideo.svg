<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="urmv-title urmv-desc">
  <title id="urmv-title">MusicVideo project card</title><desc id="urmv-desc">MusicVideo is a TypeScript motion-graphics experience with synchronized lyrics, audio bars, and a timeline.</desc>
  <defs><linearGradient id="urmv-border" x1="0" x2="1"><stop stop-color="#D6B779" stop-opacity=".6"/><stop offset="1" stop-color="#8B7CFF" stop-opacity=".45"/></linearGradient></defs>
  <style>.urmv-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.urmv-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}.urmv-bar{transform-box:fill-box;transform-origin:bottom;animation:urmv-height 2.4s ease-in-out infinite alternate}.urmv-b2{animation-delay:-.2s}.urmv-b3{animation-delay:-.4s}.urmv-b4{animation-delay:-.6s}.urmv-b5{animation-delay:-.8s}.urmv-b6{animation-delay:-1s}.urmv-b7{animation-delay:-1.2s}.urmv-b8{animation-delay:-1.4s}.urmv-b9{animation-delay:-1.6s}.urmv-b10{animation-delay:-1.8s}.urmv-b11{animation-delay:-2s}@keyframes urmv-height{from{transform:scaleY(.62)}to{transform:scaleY(1)}}.urmv-in{opacity:1;animation:urmv-in 1s cubic-bezier(.16,1,.3,1) forwards}@keyframes urmv-in{from{opacity:1;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.urmv-bar{animation:none}.urmv-in{opacity:1;animation:none}}</style>
  <rect width="1200" height="300" rx="18" fill="#090B10" stroke="url(#urmv-border)"/>
  <g fill="#D6B779">
    <rect class="urmv-bar" x="720" y="144" width="8" height="76"/><rect class="urmv-bar urmv-b2" x="736" y="126" width="8" height="94"/><rect class="urmv-bar urmv-b3" x="752" y="158" width="8" height="62"/><rect class="urmv-bar urmv-b4" x="768" y="108" width="8" height="112"/><rect class="urmv-bar urmv-b5" x="784" y="138" width="8" height="82"/><rect class="urmv-bar urmv-b6" x="800" y="120" width="8" height="100"/><rect class="urmv-bar urmv-b7" x="816" y="154" width="8" height="66"/><rect class="urmv-bar urmv-b8" x="832" y="100" width="8" height="120"/><rect class="urmv-bar urmv-b9" x="848" y="134" width="8" height="86"/><rect class="urmv-bar urmv-b10" x="864" y="116" width="8" height="104"/><rect class="urmv-bar urmv-b11" x="880" y="150" width="8" height="70"/><rect class="urmv-bar urmv-b2" x="896" y="128" width="8" height="92"/><rect class="urmv-bar urmv-b3" x="912" y="146" width="8" height="74"/><rect class="urmv-bar urmv-b4" x="928" y="112" width="8" height="108"/><rect class="urmv-bar urmv-b5" x="944" y="156" width="8" height="64"/><rect class="urmv-bar urmv-b6" x="960" y="124" width="8" height="96"/><rect class="urmv-bar urmv-b7" x="976" y="142" width="8" height="78"/><rect class="urmv-bar urmv-b8" x="992" y="104" width="8" height="116"/><rect class="urmv-bar urmv-b9" x="1008" y="150" width="8" height="70"/><rect class="urmv-bar urmv-b10" x="1024" y="118" width="8" height="102"/><rect class="urmv-bar urmv-b11" x="1040" y="138" width="8" height="82"/><rect class="urmv-bar" x="1056" y="154" width="8" height="66"/><rect class="urmv-bar urmv-b2" x="1072" y="126" width="8" height="94"/><rect class="urmv-bar urmv-b3" x="1088" y="146" width="8" height="74"/><rect class="urmv-bar urmv-b4" x="1104" y="116" width="8" height="104"/><rect class="urmv-bar urmv-b5" x="1120" y="140" width="8" height="80"/><rect class="urmv-bar urmv-b6" x="1136" y="128" width="8" height="92"/><rect class="urmv-bar urmv-b7" x="1152" y="150" width="8" height="70"/>
  </g>
  <path d="M720 226H1160" stroke="#1D2330" stroke-width="2"/><g stroke="#80CFFF" stroke-width="1"><path d="M742 226v-8m54 8v-8m68 8v-8m58 8v-8m72 8v-8m64 8v-8m64 8v-8m58 8v-8"/></g><path d="M720 226H1160" stroke="#8B7CFF" stroke-opacity=".6"/><path d="M926 214V238" stroke="#F2F1ED" stroke-width="2"><animate attributeName="x" values="720;1160;720" dur="5s" repeatCount="indefinite"/></path>
  <g class="urmv-in"><text class="urmv-mono" x="58" y="48" fill="#80CFFF" font-size="11" letter-spacing="3">04 / MOTION GRAPHICS + LYRIC SYNCHRONIZATION</text><text class="urmv-serif" x="56" y="130" fill="#F2F1ED" font-size="54">MusicVideo</text><text class="urmv-mono" x="58" y="176" fill="#D6B779" font-size="15">A browser-first visual system where audio, words,</text><text class="urmv-mono" x="58" y="202" fill="#D6B779" font-size="15">and a timeline move together.</text><text class="urmv-mono" x="58" y="248" fill="#80CFFF" font-size="12" letter-spacing="2">TYPESCRIPT · THREE.JS · WEBGL2 · GLSL · OPENTYPE.JS · VITE</text></g>
</svg>
