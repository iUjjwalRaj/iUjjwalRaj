<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="urtx-title urtx-desc">
  <title id="urtx-title">TOXIC project card</title><desc id="urtx-desc">TOXIC is The Petty Salon of Teyvat, a fictional social network built with React and TypeScript.</desc>
  <defs><linearGradient id="urtx-border" x1="0" x2="1"><stop stop-color="#D6B779" stop-opacity=".6"/><stop offset="1" stop-color="#8B7CFF" stop-opacity=".45"/></linearGradient></defs>
  <style>.urtx-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.urtx-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}.urtx-in{opacity:1;animation:urtx-in 1s cubic-bezier(.16,1,.3,1) forwards}@keyframes urtx-in{from{opacity:1;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.urtx-in{opacity:1;animation:none}}</style>
  <rect width="1200" height="300" rx="18" fill="#141821" stroke="url(#urtx-border)"/><g fill="none" stroke="#8B7CFF" stroke-width="2"><path d="M720 214l55-108 58 76 72-112 72 92 70-61 80 96"/><path d="M720 230h405" stroke="#D6B779"/><circle cx="775" cy="106" r="5" fill="#D6B779"/><circle cx="905" cy="70" r="5" fill="#80CFFF"/><circle cx="1050" cy="101" r="5" fill="#D6B779"/></g>
  <g class="urtx-in"><text class="urtx-mono" x="58" y="48" fill="#80CFFF" font-size="11" letter-spacing="3">03 / THE PETTY SALON OF TEYVAT</text><text class="urtx-serif" x="56" y="130" fill="#F2F1ED" font-size="68" letter-spacing="6">TOXIC</text><text class="urtx-mono" x="58" y="176" fill="#D6B779" font-size="15">A sharp, fictional social network for arguments,</text><text class="urtx-mono" x="58" y="202" fill="#D6B779" font-size="15">feuds, and very online character drama.</text><text class="urtx-mono" x="58" y="248" fill="#80CFFF" font-size="12" letter-spacing="2">REACT · TYPESCRIPT · VITE · FRAMER MOTION · TAILWIND CSS</text></g>
