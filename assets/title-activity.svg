<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-labelledby="ura-title2 ura-desc2">
  <title id="ura-title2">05 Activity — Shipping, one commit at a time.</title><desc id="ura-desc2">Section title for Ujjwal Raj's public GitHub activity.</desc>
  <defs><linearGradient id="ura-line2" x1="0" x2="1"><stop stop-color="#D6B779"/><stop offset=".6" stop-color="#D6B779" stop-opacity=".55"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></linearGradient><linearGradient id="ura-sheen2" x1="-260" x2="0"><stop stop-color="#D6B779"/><stop offset=".5" stop-color="#F2F1ED"/><stop offset="1" stop-color="#D6B779"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" repeatCount="indefinite"/></linearGradient><radialGradient id="ura-pulse2"><stop stop-color="#F2F1ED"/><stop offset=".5" stop-color="#D6B779" stop-opacity=".65"/><stop offset="1" stop-color="#D6B779" stop-opacity="0"/></radialGradient></defs>
  <style>.ura-serif2{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}.ura-mono2{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.ura-in2{opacity:1;animation:ura-in2 1.1s cubic-bezier(.16,1,.3,1) forwards}.ura-d22{animation-delay:.2s}.ura-d32{animation-delay:.45s}.ura-draw2{stroke-dasharray:1200;stroke-dashoffset:1200;animation:ura-draw2 1.8s cubic-bezier(.65,0,.35,1) .5s forwards}@keyframes ura-in2{from{opacity:1;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes ura-draw2{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.ura-in2{opacity:1;animation:none}.ura-draw2{animation:none;stroke-dashoffset:0}}</style>
  <rect width="1200" height="120" rx="14" fill="#090B10"/>
  <text class="ura-mono2 ura-in2" x="40" y="34" font-size="12" letter-spacing="3" fill="#D6B779"><tspan fill="#80CFFF">05</tspan>   ACTIVITY</text><text class="ura-serif2 ura-in2 ura-d22" x="38" y="84" font-size="44" font-weight="300" fill="#F2F1ED">Shipping, <tspan font-style="italic" fill="url(#ura-sheen2)">one commit</tspan> at a time.</text><text class="ura-mono2 ura-in2 ura-d32" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#80CFFF">PUBLIC SIGNAL / REFRESHED DAILY</text><path class="ura-draw2" d="M40 106H1160" stroke="url(#ura-line2)"/><circle cx="40" cy="106" r="7" fill="url(#ura-pulse2)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
</svg>
