<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="urtk-title urtk-desc">
  <title id="urtk-title">Ujjwal Raj toolkit</title>
  <desc id="urtk-desc">Technologies found in the inspected project repositories, grouped by role.</desc>
  <defs><linearGradient id="urtk-border" x1="0" x2="1"><stop stop-color="#D6B779" stop-opacity=".55"/><stop offset="1" stop-color="#8B7CFF" stop-opacity=".45"/></linearGradient></defs>
  <style>.urtk-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.urtk-in{opacity:1;animation:urtk-in 1s cubic-bezier(.16,1,.3,1) forwards}@keyframes urtk-in{from{opacity:1;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.urtk-in{opacity:1;animation:none}}</style>
  <rect width="1200" height="420" rx="18" fill="#090B10" stroke="url(#urtk-border)"/>
