    <g transform="translate(270)"><rect width="250" height="126" rx="12" fill="#141821" stroke="#1D2330"/><text class="urtk-mono" x="20" y="28" fill="#D6B779" font-size="12" letter-spacing="2">AI / CV</text><text class="urtk-mono" x="20" y="60" fill="#F2F1ED" font-size="15">PyTorch · OpenCV</text><text class="urtk-mono" x="20" y="88" fill="#F2F1ED" font-size="15">Ultralytics · LightGBM</text></g>
    <g transform="translate(540)"><rect width="250" height="126" rx="12" fill="#141821" stroke="#1D2330"/><text class="urtk-mono" x="20" y="28" fill="#D6B779" font-size="12" letter-spacing="2">FRONTEND</text><text class="urtk-mono" x="20" y="60" fill="#F2F1ED" font-size="15">React · Vite · Three.js</text><text class="urtk-mono" x="20" y="88" fill="#F2F1ED" font-size="15">Leaflet · MapLibre</text></g>
    <g transform="translate(810)"><rect width="294" height="126" rx="12" fill="#141821" stroke="#1D2330"/><text class="urtk-mono" x="20" y="28" fill="#D6B779" font-size="12" letter-spacing="2">BACKEND / DATA</text><text class="urtk-mono" x="20" y="60" fill="#F2F1ED" font-size="15">FastAPI · Express · MongoDB</text><text class="urtk-mono" x="20" y="88" fill="#F2F1ED" font-size="15">NumPy · Pandas · SciPy</text></g>
    <g transform="translate(0 148)"><rect width="250" height="126" rx="12" fill="#141821" stroke="#1D2330"/><text class="urtk-mono" x="20" y="28" fill="#D6B779" font-size="12" letter-spacing="2">WEBGL / MOTION</text><text class="urtk-mono" x="20" y="60" fill="#F2F1ED" font-size="15">WebGL2 · GLSL</text><text class="urtk-mono" x="20" y="88" fill="#F2F1ED" font-size="15">Framer Motion</text></g>
    <g transform="translate(270 148)"><rect width="250" height="126" rx="12" fill="#141821" stroke="#1D2330"/><text class="urtk-mono" x="20" y="28" fill="#D6B779" font-size="12" letter-spacing="2">MAPS / EDGE</text><text class="urtk-mono" x="20" y="60" fill="#F2F1ED" font-size="15">WebSockets · Uvicorn</text><text class="urtk-mono" x="20" y="88" fill="#F2F1ED" font-size="15">Cloudflare · Wrangler</text></g>
    <g transform="translate(540 148)"><rect width="250" height="126" rx="12" fill="#141821" stroke="#1D2330"/><text class="urtk-mono" x="20" y="28" fill="#D6B779" font-size="12" letter-spacing="2">TOOLS</text><text class="urtk-mono" x="20" y="60" fill="#F2F1ED" font-size="15">TypeScript · Tailwind CSS</text><text class="urtk-mono" x="20" y="88" fill="#F2F1ED" font-size="15">OpenType.js · PyYAML</text></g>
