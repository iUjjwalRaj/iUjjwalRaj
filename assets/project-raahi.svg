<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="urra-title urra-desc">
  <title id="urra-title">RAAHI project card</title><desc id="urra-desc">RAAHI is an AI-powered urban intelligence platform using public transport fleets for real-time road monitoring, event detection, and actionable insights.</desc>
  <defs><linearGradient id="urra-border" x1="0" x2="1"><stop stop-color="#D6B779" stop-opacity=".6"/><stop offset="1" stop-color="#8B7CFF" stop-opacity=".45"/></linearGradient><pattern id="urra-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#80CFFF" stroke-opacity=".13"/></pattern></defs>
  <style>.urra-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.urra-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}.urra-in{opacity:1;animation:urra-in 1s cubic-bezier(.16,1,.3,1) forwards}@keyframes urra-in{from{opacity:1;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.urra-in{opacity:1;animation:none}}</style>
  <rect width="1200" height="300" rx="18" fill="#090B10" stroke="url(#urra-border)"/><rect x="650" y="28" width="500" height="244" rx="12" fill="url(#urra-grid)"/>
  <g fill="none" stroke="#D6B779" stroke-width="2"><path d="M700 222l92-66 78 22 85-91 120 62 55-75M700 222h430M792 156l-2 66m80-44v44m85-91v91m120-29v29"/></g><g fill="#80CFFF"><circle cx="792" cy="156" r="6"><animate attributeName="cx" values="792;1075;792" dur="5s" repeatCount="indefinite"/></circle><circle cx="955" cy="87" r="4"/><circle cx="1075" cy="149" r="4"/></g>
  <g class="urra-in"><text class="urra-mono" x="58" y="48" fill="#80CFFF" font-size="11" letter-spacing="3">02 / URBAN INTELLIGENCE PLATFORM</text><text class="urra-serif" x="56" y="128" fill="#F2F1ED" font-size="58">RAAHI</text><text class="urra-mono" x="58" y="171" fill="#D6B779" font-size="15">Public-transport fleets become mobile sensing units</text><text class="urra-mono" x="58" y="197" fill="#D6B779" font-size="15">for road monitoring, event detection, and insight.</text><text class="urra-mono" x="58" y="248" fill="#80CFFF" font-size="12" letter-spacing="2">PYTHON · OPENCV · PYTORCH · FASTAPI · REACT · MONGODB</text></g>
</svg>
