<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="urra-title urra-desc">
  <title id="urra-title">RAAHI project card</title><desc id="urra-desc">RAAHI is an AI-powered urban intelligence platform using public transport fleets for real-time road monitoring, event detection, and actionable insights.</desc>
  <defs><linearGradient id="urra-border" x1="0" x2="1"><stop stop-color="#D6B779" stop-opacity=".6"/><stop offset="1" stop-color="#8B7CFF" stop-opacity=".45"/></linearGradient><pattern id="urra-grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M0 17H34M17 0V34" fill="none" stroke="#80CFFF" stroke-opacity=".1"/></pattern></defs>
  <style>.urra-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.urra-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}.urra-in{opacity:1;animation:urra-in 1s cubic-bezier(.16,1,.3,1) forwards}@keyframes urra-in{from{opacity:1;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.urra-in{opacity:1;animation:none}}</style>
  <rect width="1200" height="300" rx="18" fill="#090B10" stroke="url(#urra-border)"/><rect x="650" y="28" width="500" height="244" rx="12" fill="url(#urra-grid)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path id="urra-route-a" d="M690 224L760 184L818 202L880 142L944 166L1010 112L1080 146L1130 92" stroke="#80CFFF" stroke-width="2"/><path id="urra-route-b" d="M704 72L770 112L846 98L914 132L992 204L1060 182L1138 220" stroke="#D6B779" stroke-width="2"/><path d="M720 246L790 222L860 236L930 210L1004 238L1080 216" stroke="#8B7CFF" stroke-width="1.5"/></g>
  <g fill="#F2F1ED"><circle cx="760" cy="184" r="4"/><circle cx="880" cy="142" r="4"/><circle cx="1010" cy="112" r="4"/><circle cx="770" cy="112" r="4"/><circle cx="914" cy="132" r="4"/><circle cx="1060" cy="182" r="4"/></g>
  <g fill="#80CFFF"><circle cx="690" cy="224" r="5"><animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#urra-route-a"/></animateMotion></circle><circle cx="704" cy="72" r="5"><animateMotion dur="6.5s" begin="-2s" repeatCount="indefinite" rotate="auto"><mpath href="#urra-route-b"/></animateMotion></circle><circle cx="720" cy="246" r="5"><animateMotion dur="7s" begin="-4s" repeatCount="indefinite" rotate="auto"><mpath href="#urra-route-a"/></animateMotion></circle></g>
  <g><circle cx="992" cy="204" r="18" fill="none" stroke="#D6B779" stroke-width="2"><animate attributeName="r" values="12;24;12" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.25;.9" dur="2.4s" repeatCount="indefinite"/></circle><text class="urra-mono" x="1018" y="208" fill="#D6B779" font-size="11" letter-spacing="2">EVENT</text></g>
  <g class="urra-in"><text class="urra-mono" x="58" y="48" fill="#80CFFF" font-size="11" letter-spacing="3">02 / URBAN INTELLIGENCE PLATFORM</text><text class="urra-serif" x="56" y="128" fill="#F2F1ED" font-size="58">RAAHI</text><text class="urra-mono" x="58" y="171" fill="#D6B779" font-size="15">Public-transport fleets become mobile sensing units</text><text class="urra-mono" x="58" y="197" fill="#D6B779" font-size="15">for road monitoring, event detection, and insight.</text><text class="urra-mono" x="58" y="248" fill="#80CFFF" font-size="12" letter-spacing="2">PYTHON · OPENCV · PYTORCH · FASTAPI · REACT · MONGODB</text></g>
</svg>
