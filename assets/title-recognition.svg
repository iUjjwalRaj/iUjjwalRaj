<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-labelledby="urr-title urr-desc">
  <title id="urr-title">02 Recognition — Earned, not claimed.</title><desc id="urr-desc">Section title for Ujjwal Raj's recognition.</desc>
  <defs><linearGradient id="urr-line" x1="0" x2="1"><stop stop-color="#D6B779"/><stop offset=".6" stop-color="#D6B779" stop-opacity=".55"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></linearGradient><linearGradient id="urr-sheen" x1="-260" x2="0"><stop stop-color="#D6B779"/><stop offset=".5" stop-color="#F2F1ED"/><stop offset="1" stop-color="#D6B779"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" repeatCount="indefinite"/></linearGradient><radialGradient id="urr-pulse"><stop stop-color="#F2F1ED"/><stop offset=".5" stop-color="#D6B779" stop-opacity=".65"/><stop offset="1" stop-color="#D6B779" stop-opacity="0"/></radialGradient></defs>
  <style>.urr-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}.urr-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.urr-in{animation:urr-in 1.1s cubic-bezier(.16,1,.3,1) both}.urr-d2{animation-delay:.2s}.urr-d3{animation-delay:.45s}.urr-draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:urr-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards}@keyframes urr-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes urr-draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.urr-in{animation:none}.urr-draw{animation:none;stroke-dashoffset:0}}</style>
  <rect width="1200" height="120" rx="14" fill="#090B10"/>
  <text class="urr-mono urr-in" x="40" y="34" font-size="12" letter-spacing="3" fill="#D6B779"><tspan fill="#80CFFF">02</tspan>   RECOGNITION</text><text class="urr-serif urr-in urr-d2" x="38" y="84" font-size="44" font-weight="300" fill="#F2F1ED">Earned, <tspan font-style="italic" fill="url(#urr-sheen)">not claimed.</tspan></text><text class="urr-mono urr-in urr-d3" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#80CFFF">PROOF / DISCIPLINE / CURIOSITY</text><path class="urr-draw" d="M40 106H1160" stroke="url(#urr-line)"/><circle cx="40" cy="106" r="7" fill="url(#urr-pulse)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
</svg>
