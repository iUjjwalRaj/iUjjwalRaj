<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-labelledby="urk-title urk-desc">
  <title id="urk-title">06 Connect — Let's build something strange.</title><desc id="urk-desc">Section title for connecting with Ujjwal Raj through his portfolio or GitHub.</desc>
  <defs><linearGradient id="urk-line" x1="0" x2="1"><stop stop-color="#D6B779"/><stop offset=".6" stop-color="#D6B779" stop-opacity=".55"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></linearGradient><linearGradient id="urk-sheen" x1="-260" x2="0"><stop stop-color="#D6B779"/><stop offset=".5" stop-color="#F2F1ED"/><stop offset="1" stop-color="#D6B779"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" repeatCount="indefinite"/></linearGradient><radialGradient id="urk-pulse"><stop stop-color="#F2F1ED"/><stop offset=".5" stop-color="#D6B779" stop-opacity=".65"/><stop offset="1" stop-color="#D6B779" stop-opacity="0"/></radialGradient></defs>
  <style>.urk-serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif}.urk-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.urk-in{animation:urk-in 1.1s cubic-bezier(.16,1,.3,1) both}.urk-d2{animation-delay:.2s}.urk-d3{animation-delay:.45s}.urk-draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:urk-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards}@keyframes urk-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes urk-draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.urk-in{animation:none}.urk-draw{animation:none;stroke-dashoffset:0}}</style>
  <rect width="1200" height="120" rx="14" fill="#090B10"/>
  <text class="urk-mono urk-in" x="40" y="34" font-size="12" letter-spacing="3" fill="#D6B779"><tspan fill="#80CFFF">06</tspan>   CONNECT</text><text class="urk-serif urk-in urk-d2" x="38" y="84" font-size="44" font-weight="300" fill="#F2F1ED">Let's build something <tspan font-style="italic" fill="url(#urk-sheen)">strange.</tspan></text><text class="urk-mono urk-in urk-d3" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#80CFFF">PORTFOLIO / OPEN SOURCE / HELLO</text><path class="urk-draw" d="M40 106H1160" stroke="url(#urk-line)"/><circle cx="40" cy="106" r="7" fill="url(#urk-pulse)" opacity="0"><animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
</svg>
