<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="urh-title urh-desc">
  <title id="urh-title">Ujjwal Raj — AI Engineer and Creative Technologist</title>
  <desc id="urh-desc">A midnight neural network with a UR monogram, champagne-gold nodes, violet orbital paths, and an abstract field of intelligent systems.</desc>
  <defs>
    <linearGradient id="urh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090B10"/><stop offset=".54" stop-color="#141821"/><stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <linearGradient id="urh-edge" x1="0" x2="1">
      <stop stop-color="#D6B779" stop-opacity=".12"/><stop offset=".55" stop-color="#D6B779" stop-opacity=".8"/><stop offset="1" stop-color="#8B7CFF" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="urh-sheen" x1="-240" x2="0">
      <stop stop-color="#D6B779"/><stop offset=".5" stop-color="#F2F1ED"/><stop offset="1" stop-color="#D6B779"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1440 0;1440 0" keyTimes="0;.42;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="urh-aura"><stop stop-color="#8B7CFF" stop-opacity=".25"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient>
    <filter id="urh-glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="urh-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#80CFFF" stroke-opacity=".045"/></pattern>
  </defs>
  <style>
    .urh-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .urh-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .urh-fade { opacity:1; animation: urh-fade 1.2s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes urh-fade { from { opacity: 1; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .urh-fade { opacity:1; animation: none; } }
  </style>
  <rect width="1200" height="420" rx="18" fill="url(#urh-bg)"/>
  <rect x="18" y="18" width="1164" height="384" rx="13" fill="url(#urh-grid)" stroke="url(#urh-edge)"/>
  <circle cx="930" cy="210" r="250" fill="url(#urh-aura)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M620 64L710 120 805 78 884 154 984 104 1080 170 1160 118M590 158L680 214 770 168 858 242 950 192 1042 266 1158 224M616 286L704 238 796 304 884 264 984 330 1082 282 1160 350M690 90L680 214 704 238M805 78L770 168 796 304M884 154L858 242 884 264M984 104L950 192 984 330M1080 170L1042 266 1082 282" stroke="#D6B779" stroke-opacity=".34" stroke-width="1.2"/>
    <path d="M648 348C748 276 748 120 876 82S1090 90 1164 182M628 380C762 310 804 162 928 130s164 32 232 114M734 54C836 126 918 96 980 46" stroke="#80CFFF" stroke-opacity=".2" stroke-width="1"/>
    <ellipse cx="924" cy="210" rx="258" ry="92" transform="rotate(-17 924 210)" stroke="#8B7CFF" stroke-opacity=".52"/>
    <ellipse cx="924" cy="210" rx="230" ry="72" transform="rotate(42 924 210)" stroke="#8B7CFF" stroke-opacity=".3"/>
    <ellipse cx="924" cy="210" rx="168" ry="52" transform="rotate(76 924 210)" stroke="#80CFFF" stroke-opacity=".25"/>
    <path d="M666 210a258 92 0 0 0 516 0" stroke="#D6B779" stroke-opacity=".65" stroke-dasharray="2 15">
      <animateTransform attributeName="transform" type="rotate" from="0 924 210" to="360 924 210" dur="30s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#D6B779" filter="url(#urh-glow)">
    <circle cx="620" cy="64" r="3"/><circle cx="710" cy="120" r="4"/><circle cx="805" cy="78" r="3"/><circle cx="884" cy="154" r="4"/><circle cx="984" cy="104" r="3"/><circle cx="1080" cy="170" r="4"/><circle cx="1160" cy="118" r="3"/>
    <circle cx="590" cy="158" r="3"/><circle cx="680" cy="214" r="4"/><circle cx="770" cy="168" r="3"/><circle cx="858" cy="242" r="4"/><circle cx="950" cy="192" r="3"/><circle cx="1042" cy="266" r="4"/><circle cx="1158" cy="224" r="3"/>
    <circle cx="616" cy="286" r="3"/><circle cx="704" cy="238" r="4"/><circle cx="796" cy="304" r="3"/><circle cx="884" cy="264" r="4"/><circle cx="984" cy="330" r="3"/><circle cx="1082" cy="282" r="4"/><circle cx="1160" cy="350" r="3"/>
    <circle cx="748" cy="276" r="2.5"/><circle cx="876" cy="82" r="2.5"/><circle cx="928" cy="130" r="3"/><circle cx="1090" cy="90" r="2.5"/>
  </g>
  <g fill="#80CFFF" opacity=".8">
    <circle cx="666" cy="210" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="876" cy="318" r="1.8"><animate attributeName="opacity" values=".1;1;.1" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="142" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1132" cy="304" r="1.6"><animate attributeName="opacity" values=".1;1;.1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
  <g class="urh-fade">
    <text class="urh-mono" x="68" y="88" fill="#80CFFF" font-size="11" letter-spacing="3.5">AI ENGINEERING / CREATIVE COMPUTING</text>
    <text class="urh-serif" x="64" y="190" fill="url(#urh-sheen)" font-size="86" letter-spacing="-3">Ujjwal Raj</text>
    <text class="urh-mono" x="68" y="236" fill="#D6B779" font-size="15" letter-spacing="3">AI ENGINEER  |  CREATIVE TECHNOLOGIST</text>
    <path d="M68 258H444" stroke="#D6B779" stroke-width="2"/><circle cx="444" cy="258" r="3" fill="#80CFFF"/>
    <text class="urh-mono" x="68" y="302" fill="#F2F1ED" fill-opacity=".62" font-size="11" letter-spacing="2">INTELLIGENT SYSTEMS  /  EDGE AI  /  REAL-TIME EXPERIENCES</text>
  </g>
  <g transform="translate(82 350)" fill="none" stroke="#D6B779" stroke-width="2">
    <path d="M0 0L17-20 34 0 51-20 68 0" opacity=".75"/><circle cx="17" cy="-20" r="3" fill="#D6B779"/><circle cx="51" cy="-20" r="3" fill="#D6B779"/>
    <text class="urh-mono" x="84" y="5" fill="#F2F1ED" stroke="none" font-size="12" letter-spacing="2">UR / SYSTEMS IN MOTION</text>
  </g>
</svg>
