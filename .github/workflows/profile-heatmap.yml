name: Refresh profile heatmap

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-heatmap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public contributions
        env:
          GH_USERNAME: iUjjwalRaj
        run: node scripts/fetch-contributions.mjs
      - name: Render contribution SVG
        run: node scripts/build-heatmap-svg.mjs
      - name: Commit only when changed
        run: |
          git add data/contributions.json assets/contribution-heatmap.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution heatmap"
          git push
